---
# Promote this standalone server into the first DC of a new forest.

- name: Wait for WinRM to be ready
  ansible.builtin.wait_for_connection:
    timeout: 300
    delay: 15

- name: Install AD DS, DNS and management features
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - DNS
      - RSAT-AD-PowerShell
      - RSAT-AD-AdminCenter
      - GPMC
    include_management_tools: true
    state: present
  register: feature_install

- name: Create the new forest (promotes to first DC, reboots, reconnects)
  microsoft.ad.domain:
    dns_domain_name: "{{ dc_domain_fqdn }}"
    domain_netbios_name: "{{ dc_domain_netbios }}"
    safe_mode_password: "{{ dc_dsrm_password }}"
    domain_mode: "{{ dc_domain_mode }}"
    forest_mode: "{{ dc_forest_mode }}"
    install_dns: true
    reboot: true
  no_log: true

- name: Wait for WinRM to return after promotion reboot
  ansible.builtin.wait_for_connection:
    timeout: 600
    delay: 30

# AD Web Services can lag the reboot; poll a cheap AD query until it answers so
# subsequent microsoft.ad.* tasks don't race the service.
- name: Wait for AD Web Services to answer
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory -ErrorAction Stop
      (Get-ADDomain).DNSRoot
  register: ad_ready
  until: ad_ready.error | default([]) | length == 0
  retries: 30
  delay: 20
