---
# Create the domain-join service account and delegate machine-join rights on the
# Servers OU so it can create/manage computer objects there (least-privilege
# alternative to Domain Admins for domain joins).

- name: Create the domain-join service account
  microsoft.ad.user:
    name: "{{ dc_service_account_name }}"
    sam_account_name: "{{ dc_service_account_name }}"
    upn: "{{ dc_service_account_name }}@{{ dc_domain_fqdn }}"
    display_name: "{{ dc_service_account_display_name }}"
    description: "{{ dc_service_account_description }}"
    password: "{{ dc_service_account_password }}"
    path: "OU=ServiceAccounts,OU={{ dc_base_ou }},{{ dc_domain_dn }}"
    password_never_expires: true
    enabled: true
    state: present
  no_log: true

- name: Delegate machine-join rights on the Servers OU
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $ou = "OU=Servers,OU={{ dc_base_ou }},{{ dc_domain_dn }}"
      $id = "{{ dc_domain_netbios }}\{{ dc_service_account_name }}"
      # Create/delete computer child objects in this OU
      & dsacls $ou /I:T /G "$($id):CCDC;computer" | Out-Null
      # Full control over descendant computer objects (join, reset password, rename)
      & dsacls $ou /I:S /G "$($id):GA;;computer" | Out-Null
      if ($LASTEXITCODE -ne 0) { throw "dsacls failed with exit code $LASTEXITCODE" }
  changed_when: true
