---
# Ansible collections required to build and manage the AD domain controller.
# Installed by promote_via_ssm.sh (ansible-galaxy collection install -r requirements.yml)
# and by the setup_terraform_host role.
collections:
  - name: microsoft.ad
    version: ">=1.7.0,<2.0.0"
  - name: ansible.windows
    version: ">=2.5.0,<3.0.0"
  - name: community.windows
    version: ">=2.3.0,<3.0.0"
